name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches mod version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mod=$(grep -oP 'VERSION = "\K[^"]+' pc-mod/BalatroSync/balatro_sync.lua)
          if [ "$tag" != "$mod" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the mod version $mod in balatro_sync.lua"
            exit 1
          fi

      - name: Build release archive
        run: |
          name="balatro-save-sync-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          # only tracked files, with .gitattributes line endings (CRLF for .bat)
          git archive --format=tar HEAD server pc-mod android README.md LICENSE | tar -x -C "dist/$name"
          cd dist
          zip -rq "$name.zip" "$name"
          sha256sum "$name.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
