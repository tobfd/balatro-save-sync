name: Release

# Two ways to release:
# - Actions tab -> Release -> "Run workflow" -> enter the version (e.g. 1.0.1)
# - or push a tag like v1.0.1
# Before: set VERSION in pc-mod/BalatroSync/balatro_sync.lua and lovely.toml,
# and add a "## x.y.z" section to CHANGELOG.md (it becomes the release notes).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (must match VERSION in balatro_sync.lua)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version like v1.2.3"
            exit 1
          fi
          mod=$(grep -oP 'VERSION = "\K[^"]+' pc-mod/BalatroSync/balatro_sync.lua)
          if [ "${TAG#v}" != "$mod" ]; then
            echo "::error::$TAG does not match the mod version $mod in balatro_sync.lua"
            exit 1
          fi
          if ! grep -qE "^## \[?${TAG#v}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## ${TAG#v}'"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

      - name: Build release archive
        run: |
          name="balatro-save-sync-${TAG}"
          mkdir -p "dist/$name"
          # only tracked files, with .gitattributes line endings (CRLF for .bat)
          git archive --format=tar HEAD server pc-mod android README.md LICENSE | tar -x -C "dist/$name"
          cd dist
          zip -rq "$name.zip" "$name"
          sha256sum "$name.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v ver="${TAG#v}" '
            /^## / { if (found) exit; if ($2 == ver || $2 == "[" ver "]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          cat dist/notes.md

      - name: Create GitHub release
        run: |
          args=(--title "$TAG" --notes-file dist/notes.md --generate-notes)
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--target "$GITHUB_SHA")   # creates the tag on this commit
          else
            args+=(--verify-tag)
          fi
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt "${args[@]}"
